# Flink session cluster + SQL Gateway + Kafka, one file for every supported version.
#   FLINK_VERSION=2.2 docker compose -f docker/compose.yml up -d     (1.20 | 2.0 | 2.2 | 2.3)
# REST :8081 · SQL Gateway :8083 · Kafka :${KAFKA_PORT:-9092} (host) / kafka:19092 (inside the network)
name: streamlab-flink-${FLINK_VERSION:-2.2}

x-flink: &flink
  image: flink:${FLINK_VERSION:-2.2}
  volumes:
    - savepoints:/tmp/flink-savepoints
  environment:
    FLINK_PROPERTIES: |
      jobmanager.rpc.address: jobmanager
      rest.address: jobmanager
      taskmanager.numberOfTaskSlots: 4
      parallelism.default: 2
      # Rescale (PUT /jobs/:jid/resource-requirements) needs the adaptive scheduler (docs/FLINK_API.md).
      jobmanager.scheduler: adaptive
      rest.flamegraph.enabled: true
      state.savepoints.dir: file:///tmp/flink-savepoints
      state.checkpoints.dir: file:///tmp/flink-savepoints/checkpoints

services:
  jobmanager:
    <<: *flink
    command: jobmanager
    ports: ['8081:8081']
    healthcheck:
      test: ['CMD-SHELL', 'curl -sf http://localhost:8081/config >/dev/null']
      interval: 5s
      retries: 30

  taskmanager:
    <<: *flink
    command: taskmanager
    depends_on: { jobmanager: { condition: service_healthy } }

  sql-gateway:
    <<: *flink
    command: >
      bin/sql-gateway.sh start-foreground
      -Dsql-gateway.endpoint.rest.address=0.0.0.0
      -Dsql-gateway.endpoint.rest.port=8083
      -Drest.address=jobmanager
      -Djobmanager.rpc.address=jobmanager
    ports: ['8083:8083']
    depends_on: { jobmanager: { condition: service_healthy } }

  kafka:
    image: apache/kafka:4.1.0
    ports: ['${KAFKA_PORT:-9092}:9092']
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:19092,HOST://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:19092,HOST://localhost:${KAFKA_PORT:-9092}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,HOST:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1

volumes:
  savepoints:
